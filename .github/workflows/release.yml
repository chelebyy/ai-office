name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import fs from 'node:fs'; const v=JSON.parse(fs.readFileSync('package.json','utf8')).version; if(process.env.RELEASE_TAG !== 'v'+v) throw new Error('Tag must match package.json version');"
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "AI Office $RELEASE_TAG"
